[package]
name = "tempest_rising"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = "0.7.6"
avian3d = "0.7.0"
bevy = { version = "0.19", features = ["default", "audio-all-formats"] }
bevy-tnua = "0.32.0"
bevy-tnua-avian3d = "0.12.0"
bevy_egui = "0.41"
bevy_gltf = "0.19.0"
bevy_panorbit_camera = "0.35.0"
bytemuck = "1.25.0"
fastrand = "2.4.1"
getrandom = "0.4.2"
glam = { version = "0.33.3", features = ["fast-math"] }
crossbeam = "0.8.4"
hashbrown = "0.17.1"
image = "0.25.10"
parking_lot = "0.12.5"
profiling = "1.0.18"
rand = "0.10.1"
rayon = "1.12.0"
rustc-hash = "2.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
slotmap = "1.1.1"
smallvec = "1.15.2"
tokio = { version = "1.52.3", features = ["full"] }
web-sys = "0.3.99"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug-assertions = false
debug = false
overflow-checks = false
rpath = false

[profile.dev]
opt-level = 1                  # Light optimization (good balance)
debug = true                   # Full debug info
split-debuginfo = "unpacked"   # Better debugging on macOS
overflow-checks = true         # Catch bugs during development
incremental = true             # Faster incremental compiles

[profile.dev.package.bevy]
opt-level = 3
